name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push on the same ref cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The same target contributors run before every commit, not a copy of its
  # commands: CI and a contributor's machine must check the same thing.
  check:
    name: Typecheck, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci lays down exactly the lockfile. better-sqlite3 loads its prebuilt
      # binary; its implicit install script stays unapproved (allowScripts).
      - name: Install dependencies
        run: npm ci

      - name: make check
        run: make check

  # Hermetic: a Figma simulator and a fake Claude Code, Playwright's own
  # Chromium. No Chrome profile, no Figma account, no secrets.
  e2e:
    name: Hermetic E2E
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --with-deps installs the system libraries a fresh runner lacks;
      # make e2e-setup runs the same install without them.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: make e2e
        run: make e2e
