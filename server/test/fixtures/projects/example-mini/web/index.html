<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ejemplo mini</title>
<style>
body { margin: 0; font-family: sans-serif; font-size: 14px; }
header { height: 40px; background: rgb(20, 40, 80); color: rgb(255, 255, 255); }
.menu { display: none; margin: 0; }
.menu.abierto { display: block; }
.cookies { position: fixed; bottom: 0; left: 0; width: 300px; height: 40px; background: rgb(240, 240, 240); }
.aviso-flotante { position: fixed; top: 0; right: 0; width: 100px; height: 30px; background: rgb(255, 200, 0); }
</style>
</head>
<body>
<header><span class="marca">Ejemplo</span><button id="abrir-menu">Menú</button><ul class="menu" id="menu"><li>Uno</li><li>Dos</li></ul></header>
<main><h1 id="estado">Cargando</h1><img src="/dot.svg" width="40" height="20" alt=""><p class="publicidad">Anuncio</p><p style="display: none">Oculto</p><a id="fuera" href="http://fuera.invalid/">Otra web</a></main>
<div class="aviso-flotante">Aviso</div>
<div class="cookies" id="cookies"><button id="aceptar">Aceptar cookies</button></div>
<script>
if (document.cookie.includes("cookies=ok")) document.getElementById("cookies").remove();
document.getElementById("aceptar")?.addEventListener("click", () => {
	document.cookie = "cookies=ok; path=/";
	document.getElementById("cookies").remove();
});
document.getElementById("abrir-menu").addEventListener("click", () => document.getElementById("menu").classList.add("abierto"));
setTimeout(() => {
	document.getElementById("estado").textContent = "Listo";
	document.body.classList.add("lista");
}, 300);
window.app = { mensaje: "Escrito desde la página" };
</script>
</body>
</html>
