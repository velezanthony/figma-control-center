<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Controles de formulario</title>
<style>
body { margin: 0; font-family: sans-serif; font-size: 14px; }
input, select, textarea { display: block; width: 200px; }
input[type=checkbox], input[type=radio] { width: 16px; height: 16px; }
.con-ayuda::placeholder { color: rgb(1, 2, 3); }
</style>
</head>
<body><input type="text" value="abc"><input type="text" class="con-ayuda" placeholder="Escribe"><input type="password" value="xy"><select><option>Uno</option><option selected>Dos</option></select><textarea>hola</textarea><input type="checkbox" checked><input type="checkbox"><input type="radio" checked><input type="date" value="2026-11-11"></body>
</html>
