<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cajas y visibilidad</title>
<style>
body { margin: 0; font-family: sans-serif; font-size: 12px; }
#envoltorio { position: relative; width: 300px; height: 200px; padding: 10px; display: flex; gap: 5px; }
.caja { width: 50px; height: 30px; flex: none; }
</style>
</head>
<body><div id="envoltorio"><div class="caja" style="background: rgb(255, 0, 0)"></div><div class="caja" style="display: none"></div><div class="caja" style="visibility: hidden"></div><span style="position: absolute; width: 1px; height: 1px; overflow: hidden">solo lectores</span><div style="display: contents"><p style="margin: 0; width: 40px; height: 20px; flex: none">x</p></div><div class="caja" style="position: absolute; left: 200px; top: 100px; background: rgb(0, 0, 255)"></div></div><div style="position: fixed; left: -500px; top: 0; width: 100px; height: 100px">fuera</div><details><summary>Más</summary><p>oculto</p></details></body>
</html>
